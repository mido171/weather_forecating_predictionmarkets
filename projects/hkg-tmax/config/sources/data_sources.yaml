    historical_range: interactive
    point_in_time_status: TARGET_ONLY
    availability_rule: first public appearance must be observed and archived
    revision_policy: current Polymarket template ignores later revisions
    priority: P0
    tags: [bootstrap_now, target, hko]
    notes: "HTML shell archived directly; backing hko.xml and Daily Extract month/year payloads are archived as separate source IDs. Canonical target use remains gated by G1 field/date behavior checks."

  - id: hko_daily_extract_catalog
    provider: Hong Kong Observatory
