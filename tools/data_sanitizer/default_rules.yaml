null_tokens:
  - ""
  - "null"
  - "none"
  - "nan"
  - "na"
  - "n/a"
bounds:
  temp: [-100.0, 140.0]
  dew_pt: [-100.0, 110.0]
  rh: [0.0, 100.0]
  pressure_inhg: [25.0, 35.0]
  pressure_hpa: [850.0, 1100.0]
  pressure_unknown: [0.0, 9999.0]
  vis: [0.0, 60.0]
  wspd: [0.0, 200.0]
  wdir: [0.0, 360.0]
  gust: [0.0, 250.0]
  precip_hrly: [0.0, 10.0]
  uv_index: [0.0, 20.0]
sentinels:
  wdir: [999.0]
clds_allowed:
  - CLR
  - SKC
  - FEW
  - SCT
  - BKN
  - OVC
  - VV
  - NSC
clds_map:
  CLEAR: CLR
  SCATTERED: SCT
  BROKEN: BKN
  OVERCAST: OVC
max_phrase_length: 200
convert_pressure_to_inhg: false
