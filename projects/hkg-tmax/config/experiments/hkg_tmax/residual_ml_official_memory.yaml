  max_rmse_worse_vs_a7_c: 0.005
  max_p90_worse_vs_a7_c: 0.010
  min_month_n: 100
  max_month_worse_vs_a7_c: 0.015
  min_season_n: 1
  max_season_worse_vs_a7_c: 0.010
  min_official_max_bin_n: 150
  max_official_max_bin_worse_vs_a7_c: 0.020
  min_memory_ablation_gain_vs_without_memory_c: 0.006
  max_sealed_reversal_vs_a7_c: 0.005

