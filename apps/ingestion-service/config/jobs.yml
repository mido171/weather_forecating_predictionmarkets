jobs:
  - jobId: bootstrapKnycStationJob
    enabled: false
    description: Seed KNYC station registry and validate metadata sources.
  - jobId: backfillLightweightSourcesJob
    enabled: false
    description: Ingest lightweight KNYC sources into the canonical SQLite store.
  - jobId: backfillHeavyModelSourcesJob
    enabled: false
    description: Orchestrate Python grid/model workers for KNYC point extraction.
  - jobId: livePollingJob
    enabled: false
    description: Poll KNYC live obs and forecast sources on a recurring cadence.
  - jobId: buildDecisionSnapshotsJob
    enabled: false
    description: Materialize leakage-safe as-of feature snapshots for KNYC.
