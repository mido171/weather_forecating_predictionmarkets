[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-live"
version = "0.1.0"
description = "Shared bounded live-weather adapters and runtime utilities."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
