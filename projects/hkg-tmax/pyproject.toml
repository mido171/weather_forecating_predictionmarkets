[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkg-tmax-elite"
version = "0.1.0"
description = "Leakage-safe research infrastructure for HKO daily maximum temperature forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Private research use; third-party data remains subject to source terms"}
authors = [{name = "HKG Tmax Research"}]
dependencies = [
  "httpx>=0.27,<1",
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "mysql-connector-python>=9,<10",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<30",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6.0,<7",
  "fastapi>=0.116,<1",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
research = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<30",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "statsmodels>=0.14,<1",
  "xarray>=2024.6",
  "cfgrib>=0.9,<1",
  "eccodes>=2.47,<3",
  "zarr>=2.18,<4",
  "netCDF4>=1.7,<2",
  "matplotlib>=3.9,<4",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=3.8,<5",
]

[project.scripts]
hkg-t24 = "hkg_t24.cli:main"
hkg-tmax = "hkg_tmax.cli:main"
hkg-tmax-db = "hkg_tmax_db.cli:main"
hkg-tmax-demo-trading = "hkg_tmax_demo_trading.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
