schedule_version: 1
timezone: Asia/Hong_Kong
policy:
  scope: weather_data_acquisition_only
  polymarket: excluded
  routine_fetches_create_experiments: false
  unchanged_hash_behavior: append_ledger_only
  daily_extract_policy:
    max_successful_fetches_per_local_day: 1
    scheduled_local_time: "09:00"
    retry_after_failure_hours: 6
    no_rapid_polling: true

sources:
  - source_id: hko_daily_extract_month
    enabled: true
    schedule_type: daily_hkt
    at_local_time: "09:00"
    retry_after_failed_hours: 6
    notes: "Template source; collector requires explicit yyyymm adapter before activation."
  - source_id: hko_latest_1min_temperature
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_since_midnight_maxmin
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_relative_humidity
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_pressure
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_wind
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_solar_radiation
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_visibility
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Latest-only feed; archive all changed payloads prospectively."
  - source_id: hko_latest_uv_index
    enabled: true
    schedule_type: interval
    interval_minutes: 15
    notes: "Latest-only UV feed; archive all changed payloads prospectively."
  - source_id: hko_automatic_rainfall
    enabled: true
    schedule_type: interval
    interval_minutes: 15
    notes: "Latest-only rainfall feed; archive all changed payloads prospectively."
  - source_id: hko_current_weather_report
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Current report and regional observations; archive each changed payload."
  - source_id: hko_local_weather_forecast
    enabled: true
    schedule_type: interval
    interval_minutes: 60
    notes: "Official forecast vintage; changed payloads are separate vintages."
  - source_id: hko_nine_day_forecast
    enabled: true
    schedule_type: interval
    interval_minutes: 60
    notes: "Official forecast vintage; changed payloads are separate vintages."
  - source_id: hko_weather_warning_summary
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Warning vintages; archive every changed payload."
  - source_id: hko_weather_warning_information
    enabled: true
    schedule_type: interval
    interval_minutes: 10
    notes: "Warning detail vintages; archive every changed payload."
  - source_id: hko_special_weather_tips
    enabled: true
    schedule_type: interval
    interval_minutes: 15
    notes: "Special weather tips; archive every changed payload."
  - source_id: hko_gridded_rainfall_nowcast
    enabled: true
    schedule_type: interval
    interval_minutes: 12
    notes: "Rainfall nowcast issue feed; archive every changed issue."
  - source_id: hko_radar_image_manifest
    enabled: true
    schedule_type: interval
    interval_minutes: 6
    notes: "Current radar manifest only; image frames require the hko-backfill radar-lightning batch."
  - source_id: hko_lightning_counts_latest
    enabled: true
    schedule_type: interval
    interval_minutes: 15
    notes: "Lightning count feed; archive all changed payloads prospectively."
  - source_id: hko_tropical_cyclone_track_realtime
    enabled: true
    schedule_type: interval
    interval_minutes: 15
    notes: "Advisory-specific realtime TC track list; archive every changed payload."
  - source_id: hko_south_china_coastal_waters_bulletin
    enabled: true
    schedule_type: interval
    interval_minutes: 60
    notes: "Marine bulletin; archive every changed payload."
  - source_id: hko_latest_tidal_information
    enabled: true
    schedule_type: interval
    interval_minutes: 60
    notes: "Latest tide information; archive changed payloads prospectively."
  - source_id: hko_clmmaxt_hko
    enabled: true
    schedule_type: interval
    interval_minutes: 1440
    notes: "Historical daily Tmax proxy; latest file may revise history."
  - source_id: hko_open_data_catalog
    enabled: true
    schedule_type: interval
    interval_minutes: 1440
    notes: "Provider metadata and endpoint discovery."
  - source_id: hko_station_metadata
    enabled: true
    schedule_type: interval
    interval_minutes: 1440
    notes: "Provider metadata snapshot; archive station-page changes."
