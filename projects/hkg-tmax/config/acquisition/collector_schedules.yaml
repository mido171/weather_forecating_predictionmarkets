schedule_version: 2
timezone: Asia/Hong_Kong
policy:
  enabled: false
  execution_acknowledgement: HKG_TMAX_ENABLE_COLLECTORS
  scope: weather_data_acquisition_only
  polymarket: excluded
  routine_fetches_create_experiments: false
  unchanged_hash_behavior: append_ledger_only
  batch_collectors_skip_existing_successes: true
  no_model_training: true
  daily_extract_policy:
    max_successful_fetches_per_local_day: 1
    scheduled_local_time: "09:00"
    retry_after_failure_hours: 6
    no_rapid_polling: true

sources:
  - source_id: hko_daily_extract_batch
    enabled: false
    adapter: hko_backfill_batch
    batch: daily-extract
    schedule_type: daily_hkt
    at_local_time: "09:00"
    retry_after_failed_hours: 6
    skip_existing_successes: true
    delay_seconds: 0.2
    notes: Routine Daily Extract collector; unchanged payloads append ledger only and do not create experiments.

  - source_id: hko_latest_1min_temperature
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only feed; archive all changed station rows prospectively.
  - source_id: hko_since_midnight_maxmin
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only max/min since midnight feed.
  - source_id: hko_latest_relative_humidity
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only station humidity feed.
  - source_id: hko_latest_pressure
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only station pressure feed.
  - source_id: hko_latest_wind
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only station wind/gust feed.
  - source_id: hko_latest_solar_radiation
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only station solar-radiation feed.
  - source_id: hko_latest_uv_index
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 15
    notes: Latest-only UV feed.
  - source_id: hko_automatic_rainfall
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 15
    notes: Latest-only rainfall feed.
  - source_id: hko_latest_visibility
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Latest-only visibility feed.
  - source_id: hko_current_weather_report
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Current weather/RHR report; archive every changed payload.

  - source_id: hko_local_weather_forecast
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 60
    notes: Official local forecast vintage.
  - source_id: hko_nine_day_forecast
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 60
    notes: Official nine-day forecast vintage.
  - source_id: hko_weather_warning_summary
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Warning summary vintage.
  - source_id: hko_weather_warning_information
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 10
    notes: Warning detail vintage.
  - source_id: hko_special_weather_tips
    enabled: false
    adapter: direct_source
    schedule_type: interval
    interval_minutes: 15
    notes: Special weather tips vintage.

  - source_id: hko_arwf_current_batch
    enabled: false
    adapter: hko_backfill_batch
    batch: arwf-current
    schedule_type: interval
    interval_minutes: 30
    skip_existing_successes: true
    delay_seconds: 0.1
    notes: Discovers current HKO ARWF station/grid/current-nowcast payloads.
  - source_id: hko_radar_lightning_batch
    enabled: false
    adapter: hko_backfill_batch
    batch: radar-lightning
    schedule_type: interval
    interval_minutes: 6
    skip_existing_successes: true
    delay_seconds: 0.05
    notes: Archives radar manifests/frames, lightning and rainfall nowcast current products.
  - source_id: hko_gridded_rainfall_nowcast
    enabled: false
    adapter: direct_source
