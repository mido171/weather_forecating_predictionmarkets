spring:
  main:
    web-application-type: none
  datasource:
    url: ${KLGA_IEM_MOS_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/klga_tmax_research}
    driver-class-name: org.postgresql.Driver
    username: ${KLGA_IEM_MOS_DB_USER:postgres}
    password: ${KLGA_IEM_MOS_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

iem-mos:
  enabled: true
  job-id: klga_iem_mos_full_backfill_v1
  cutoff-id: T_1245UTC
  through: 2026-06-28
  threads: 10
  request-spacing-ms: 1100
  resume: true
  raw-output-root: bootstrap/klga_tmax/implementation/artifacts/klga_tmax/iem_mos/raw
