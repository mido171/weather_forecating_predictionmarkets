    historical_range: "1884-present coverage metadata"
    point_in_time_status: METADATA
    availability_rule: archive before resolving Daily Extract month/year payload choice
    revision_policy: provider may update endYear/endMonth and coverage ranges
    priority: P0
    tags: [target, metadata, hko]
    notes: "Despite the .xml extension, the payload is JSON text consumed by dailyExtract.htm."

  - id: hko_daily_extract_month
