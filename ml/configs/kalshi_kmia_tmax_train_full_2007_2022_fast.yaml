train_start: "2007-01-01"
train_end: "2022-12-31"
val_start: "2023-01-01"
val_end: "2023-12-31"
test_start: "2024-01-01"
test_end: "2025-12-31"
n_splits: 3
gap_days: 2
recency_lambda: 0.0005
lgbm_params:
  num_leaves: 31
  learning_rate: 0.07
  n_estimators: 300
  min_data_in_leaf: 40
  feature_fraction: 0.75
  bagging_fraction: 0.75
  bagging_freq: 1
quantile_params:
  num_leaves: 31
  learning_rate: 0.07
  n_estimators: 250
  min_data_in_leaf: 40
  feature_fraction: 0.75
  bagging_fraction: 0.75
  bagging_freq: 1
quantiles:
  - 0.05
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 0.95
probability_events:
  - name: lt_70
    type: threshold
    lt: 70
  - name: lt_75
    type: threshold
    lt: 75
  - name: ge_85
    type: threshold
    ge: 85
  - name: ge_90
    type: threshold
    ge: 90
  - name: range_80_84
    type: range
    start: 80
    end: 84
  - name: range_85_89
    type: range
    start: 85
    end: 89
stacking: false
