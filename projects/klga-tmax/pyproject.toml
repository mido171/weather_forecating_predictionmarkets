[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klga-tmax"
version = "0.1.0"
description = "KLGA Tmax Polymarket strategy foundation package"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "requests>=2.31,<3",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "pyarrow>=15,<22",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",
]

[project.scripts]
klga-tmax = "klga_tmax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
