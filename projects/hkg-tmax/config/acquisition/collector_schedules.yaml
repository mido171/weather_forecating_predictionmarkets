  - source_id: hko_satellite_current_batch
    enabled: false
    adapter: hko_backfill_batch
    batch: satellite-current
    schedule_type: interval
    interval_minutes: 15
    skip_existing_successes: true
    delay_seconds: 0
    notes: Discovers current HKO H8/FY4B/GK2B/MODIS satellite manifests and resolvable image frames.

  - source_id: hko_tropical_cyclone_track_realtime
    enabled: false
    adapter: direct_source
