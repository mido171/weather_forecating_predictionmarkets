spring:
  application:
    name: kalshi-api-service

server:
  address: ${KALSHI_SERVER_ADDRESS:127.0.0.1}

kalshi:
  environment: ${KALSHI_ENVIRONMENT:DEMO}
  production-acknowledged: ${KALSHI_PRODUCTION_ACKNOWLEDGED:false}
  auth-enabled: ${KALSHI_AUTH_ENABLED:false}
  trading-enabled: ${KALSHI_TRADING_ENABLED:false}
  auth-debug: false
  credentials-path: ${KALSHI_CREDENTIALS_PATH:}
  api-key-id: ${KALSHI_API_KEY_ID:}
  private-key-pem-path: ${KALSHI_PRIVATE_KEY_PEM_PATH:}

  timeouts:
    connect-timeout-ms: 5000
    request-timeout-ms: 10000

  retry:
    max-retries: 1
    base-backoff-ms: 250
    max-backoff-ms: 3000

  rate-limiting:
    max-read-requests-per-second: 1
    max-write-requests-per-second: 1

  web-socket:
    enabled: ${KALSHI_WEBSOCKET_ENABLED:false}
    max-reconnect-attempts: 1
    reconnect-base-backoff-ms: 500
    watchdog-timeout-seconds: 30

  live-trading:
    enabled: ${KALSHI_LIVE_TRADING_ENABLED:false}
    market-resolve-interval-seconds: 60
    publish-interval-millis: 750
    inference-refresh-interval-seconds: 15
    inference-invoke-enabled: ${KALSHI_INFERENCE_INVOKE_ENABLED:false}
    inference-invoke-python-executable: python
    inference-invoke-script-path: tools/live/mos_quantile_live_inference.py
    inference-invoke-timeout-seconds: 180
    inference-root-dir: D:\Ahmed\data\live\mos_quantile_live_inference
    inference-report-file-name: inference_report.json
    opportunities-min-win-probability: 0.60
    opportunities-min-ev: 0.30
    opportunities-min-side-price-probability: 0.25
    opportunities-max-count: 100
    strategy-reference-label: "2024-2025 | Top #3"
    strategy-period-label: "2024-10-01 -> 2025-12-31"
    strategy-sizing-mode: fractional_kelly
    strategy-kelly-fraction: 0.20
    strategy-stake-cap-usd: 700
    strategy-entry-rule: "Entry >= max(T-1 12:00Z, open+30m)"
    strategy-prediction-source: live-script replay
    next-target-date-cutoff-local-time: "17:45"
    top-levels-per-side: 8
    frontend-ws-path: /ws/live-orderbooks
    stations:
      - station-id: KNYC
        display-name: New York
        series-ticker: KXHIGHNY
        zone-id: America/New_York
      - station-id: KMIA
        display-name: Miami
        series-ticker: KXHIGHMIA
        zone-id: America/New_York
      - station-id: KMDW
        display-name: Chicago Midway
        series-ticker: KXHIGHCHI
        zone-id: America/Chicago
      - station-id: KLAX
        display-name: Los Angeles
        series-ticker: KXHIGHLAX
        zone-id: America/Los_Angeles

  backtest-grid:
    enabled: ${KALSHI_BACKTEST_GRID_ENABLED:false}
    thread-count: 1
    overwrite-sqlite: false

  guardrails:
    enabled: true
    default-max-buy-contracts: 1
    fail-closed-on-unknown-order-state: true
    cancel-resting-on-cap-breach: true
    startup-reconcile: false
    market-overrides: {}

  smoke:
    enabled: false
    market-ticker: ""
    side: yes
    desired-contracts: 1
    buy-max-cost-cents: 100
    orderbook-depth: 20
    orderbook-warmup-seconds: 5

  local-control:
    token: ${KALSHI_LOCAL_CONTROL_TOKEN:}

logging:
  level:
    root: INFO
    com.predictionmarkets.weather.kalshiapi: INFO
