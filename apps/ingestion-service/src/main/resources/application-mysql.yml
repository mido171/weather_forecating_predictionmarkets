spring:
  datasource:
    url: ${WEATHER_DB_URL:jdbc:mysql://127.0.0.1:3306/weather_predictionmarkets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${WEATHER_DB_USERNAME:}
    password: ${WEATHER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
