    live_native_cadence: daily
    expected_live_latency: once daily after HKO publication; collector policy 09:00 HKT
    actual_live_latency_statistics: pending from collector ledger
    live_issue_time_field: provider publication row/date in Daily Extract payload
    live_valid_time_field: Hong Kong local date
    live_available_at_rule: retrieved_at after scheduled fetch; no assumed latency
    historical_live_schema_compatibility: same provider family, annual/monthly payload differences
    historical_live_known_differences: current month mutates and may be incomplete before publication
    operational_point_in_time_eligibility: target-only; not permitted as predictive feature
    license_and_commercial_use_status: HKO open-data/website terms apply
    backfill_adapter: hko_backfill daily-extract
    live_adapter: hko_backfill daily-extract through daily_hkt collector
    collector_schedule: hko_daily_extract_month daily 09:00 HKT
    last_historical_success: ""
    last_live_success: ""
    coverage_status: downloaded
    blocker: predictive use remains blocked by target-parity/governance; acquisition itself is current

