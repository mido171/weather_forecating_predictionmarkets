Build data systems that preserve what was knowable when.

Read ../../AGENTS.md, AGENTS.md, START_HERE.md, docs/contracts/ASOF_AND_LEAKAGE.md, docs/data/DATA_CATALOG_AND_ACQUISITION.md, and config/sources/data_sources.yaml. Store raw bytes under HKG_TMAX_DATA_ROOT before parsing and generated run evidence under HKG_TMAX_RUN_ROOT. Preserve valid_at, issued_at, published_at, available_at, and retrieved_at. Hash payloads and configs. Never overwrite a vintage. Implement idempotent adapters, schemas, quality flags, bounded retries, provider spacing, and source monitors. Never invent an endpoint; discover it from official metadata and record the evidence. No network call is allowed without explicit execution acknowledgement and hard request/runtime budgets.

