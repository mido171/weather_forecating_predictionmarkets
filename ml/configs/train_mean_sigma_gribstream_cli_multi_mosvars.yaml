  derived:
    ensemble_stats: true
    pairwise_deltas: true
    model_vs_ens_deltas: true
    calendar: true
    station_onehot: true
    climatology:
      enabled: false
      label_lag_days: 2
      rolling_windows_days:
      - 7
      - 30
models:
  mean:
    candidates:
    - ridge
    - random_forest
    - gbr
    - lgbm
    - xgb
    - catboost
    primary: lgbm
    param_grid:
      ridge:
        alpha:
        - 0.1
        - 1.0
        - 10.0
      random_forest:
        n_estimators:
        - 200
        max_depth:
        - 8
        - 16
        - null
        min_samples_leaf:
        - 1
        - 3
      gbr:
        n_estimators:
        - 200
        max_depth:
        - 3
        - 5
        learning_rate:
        - 0.05
        - 0.1
      lgbm:
        num_leaves:
        - 31
        - 63
        min_data_in_leaf:
        - 20
        - 50
        feature_fraction:
        - 0.8
        bagging_fraction:
        - 0.8
        lambda_l1:
        - 0.0
        - 0.1
        lambda_l2:
        - 0.0
        - 0.1
        learning_rate:
        - 0.05
        - 0.1
        n_estimators:
        - 300
      xgb:
        max_depth:
        - 4
        - 6
        learning_rate:
        - 0.05
        - 0.1
        n_estimators:
        - 300
        subsample:
        - 0.8
        colsample_bytree:
        - 0.8
        min_child_weight:
        - 1
        - 5
        reg_lambda:
        - 1.0
      catboost:
        depth:
        - 6
        - 8
        learning_rate:
        - 0.05
        - 0.1
        iterations:
        - 500
        l2_leaf_reg:
        - 3
        - 10
  sigma:
    method: two_stage
    primary: lgbm
    sigma_floor: 0.25
    eps: 1.0e-06
    param_grid:
      lgbm:
        num_leaves:
        - 31
        - 63
        min_data_in_leaf:
        - 20
        - 50
        learning_rate:
        - 0.05
        - 0.1
        n_estimators:
        - 300
artifacts:
  root_dir: artifacts
  run_id: null
  overwrite: false
seeds:
  global_seed: 1337
  force_single_thread: true
distribution:
  support_min_f: -30
  support_max_f: 130
calibration:
  enabled: true
  method: isotonic
  bins_to_calibrate:
  - name: lt_52
    type: threshold
    lt: 52
  - name: ge_90
    type: threshold
    ge: 90
postprocess:
  global_normal_calibration:
    enabled: false
    cal_start: null
    cal_end: null
    ddof: 1
    station_scope: ALL
