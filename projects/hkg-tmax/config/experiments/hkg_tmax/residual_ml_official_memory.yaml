seed: 20260706
allow_leakage_failures: false

dates:
  label_core_start_date: "2000-01-02"
  label_core_end_date: "2023-12-31"
  sealed_start_date: "2024-01-01"
  sealed_end_date: "2026-05-31"

cutoff_profiles:
  - tminus1_2359
  - tminus1_2100
  - tminus1_1800

primary_cutoff_profile: tminus1_2359

data_sources:
  official_forecast_source: public.hko_historical_forecasts_2000_2026
  label_core_source: label_core.hko_daily_tmax
  sealed_confirmation_source: sealed_confirmation.hko_daily_tmax
  target_history_source: feature_safe.hko_target_history_pre2024
