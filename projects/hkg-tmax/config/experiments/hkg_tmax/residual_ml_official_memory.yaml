  previous_results_dir: experiments/campaigns/residual-modeling/strategy/results
  previous_champion_model_id: A7_final_residual_ensemble
  previous_raw_model_id: A0_raw_official

feature_policy:
  max_raw_features: 90
  max_features_with_residual_memory: 130
  use_pruned_feature_set: true
  include_full_323_feature_matrix: false
  include_full_station_network: false
  include_full_text_nlp: false
  include_tail_router_labels: false
  include_raw_official_error_bins: false
  include_helped_worsened_labels: false
  include_direct_absolute_predictions_as_predictors: false

residual_memory:
  min_lag_days: 2
  lag1_enabled: false
  same_cutoff_profile_only: true
  large_residual_threshold_c: 1.5
  min_counts:
    roll7: 4
    roll14: 7
    roll30: 15
    roll60: 30
  d1_shrinkage:
    shrink_grid: [0.10, 0.20, 0.35, 0.50]
    cap_abs_grid_c: [0.20, 0.35, 0.50]
  d5_conservative_blend:
    scalar_grid: [0.70, 0.85, 1.00]
    cap_abs_grid_c: [0.35, 0.50, 0.75]

models:
  D0_A7_reproduction: true
  D1_official_residual_memory_shrinkage: true
  D2_A3_plus_residual_memory_lgbm: true
  D3_pruned_full_plus_residual_memory_lgbm: true
  D4_residual_memory_constrained_stack: true
  D5_conservative_A7_plus_memory_blend: true

temporal_governance:
  selection_folds:
    - fold1_2011_2013
    - fold2_2014_2016
    - fold3_2017_2019
    - fold4_2020_2021
  presealed_holdout: "2022-01-01..2023-12-31"
  sealed_confirmation: "2024-01-01..2026-05-31"
  sealed_usage: report_only_after_freeze

acceptance_gates:
